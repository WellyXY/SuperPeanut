<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SuperPeanut</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="mark">S</div>
        <div><h1>SuperPeanut</h1><p>LinkedIn 招聘匹配工作台</p></div>
      </header>
      <form id="login-view" class="login-view" hidden>
        <div><strong>登录你的工作区</strong><span>HC、候选人和 Peanut 对话会跟随账号同步</span></div>
        <label>账号<input id="login-username" autocomplete="username" required></label>
        <label>密码<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登录</button>
        <button class="auth-switch" id="show-register" type="button">没有账号？建立新账号</button>
        <p id="login-message" class="message"></p>
      </form>
      <form id="register-view" class="login-view" hidden>
        <div><strong>建立 SuperPeanut 账号</strong><span>创建后会自动登录，并获得独立的 HC 与候选人空间</span></div>
        <label>显示名称<input id="register-name" maxlength="50" autocomplete="name" required placeholder="例如 Alice"></label>
        <label>登录账号<input id="register-username" minlength="2" maxlength="32" pattern="[A-Za-z0-9._-]+" autocomplete="username" required placeholder="alice"></label>
        <label>密码<input id="register-password" type="password" minlength="4" maxlength="128" autocomplete="new-password" required></label>
        <button class="primary" type="submit">建立并登录</button>
        <button class="auth-switch" id="show-login" type="button">已有账号？返回登录</button>
        <p id="register-message" class="message"></p>
      </form>
      <div id="workspace-view" hidden>
        <section class="account"><div><span id="account-name"></span><small id="account-id"></small></div><button id="logout-button" type="button">退出</button></section>
        <section class="status"><span id="hc-count">读取中</span><span>已加载岗位</span></section>
        <button class="primary" id="open-panel">在 LinkedIn 打开工作台</button>
        <label class="import-label" for="import-file">导入／更新 HC 清单（XLSX）</label>
        <input id="import-file" type="file" accept=".xlsx,.xls" hidden>
        <p id="message" class="message">首次安装不会预载岗位，请先导入或新增 HC。</p>
        <p class="footnote">在 LinkedIn 候选人主页中点击悬浮双狗，即可生成单一最佳岗位报告。</p>
      </div>
    </main>
    <script src="lib/storage.js"></script>
    <script src="lib/xlsx-parser.js"></script>
    <script src="data/default-hcs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
